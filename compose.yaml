name: ames-errantes
x-app: &app
  build: .
  image: ames-errantes-local:4
  init: true
  restart: unless-stopped
  environment: &environment
    DATABASE_URL: postgres://ames:${POSTGRES_PASSWORD:?Run the initialization script}@db:5432/ames
    COOKIE_SECURE: "false"
    PUBLIC_SITE_URL: http://${PUBLIC_HOST:-localhost}:${SITE_PORT:-4173}
    PUBLIC_SPACE_URL: http://${PUBLIC_HOST:-localhost}:${SPACE_PORT:-4174}
  volumes:
    - app-data:/data
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ames
      POSTGRES_DB: ames
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the initialization script}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ames -d ames"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    restart: "no"
    working_dir: /app
    command: ["node", "packages/core/src/initialize.mjs"]
    environment:
      <<: *environment
      LEGACY_EXPORT: /migration/source.json
    volumes:
      - app-data:/data
      - ./data/migration:/migration:ro
    depends_on:
      db:
        condition: service_healthy
  site:
    <<: *app
    working_dir: /app/ame-errante
    command:
      [
        "node",
        "node_modules/next/dist/bin/next",
        "start",
        "--hostname",
        "0.0.0.0",
        "--port",
        "3000",
      ]
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${SITE_PORT:-4173}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  espace:
    <<: *app
    working_dir: /app/ames-errantes-interne
    command:
      [
        "node",
        "node_modules/next/dist/bin/next",
        "start",
        "--hostname",
        "0.0.0.0",
        "--port",
        "3000",
      ]
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${SPACE_PORT:-4174}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    working_dir: /app/ame-errante
    command: ["node", "../services/worker.mjs"]
    environment:
      <<: *environment
      RUN_MAINTENANCE_WORKER: "true"
volumes:
  postgres-data:
  app-data:
